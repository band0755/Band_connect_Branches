<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Band Connect Patient Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bc-midnight: #161329;
      --bc-card: #201a38;
      --bc-card-inner: #292147;
      --bc-purple-primary: #6f58a8;
      --bc-purple-hover: #5d4694;
      --bc-border: #382e5c;
      --bc-text: #ffffff;
      --bc-text-muted: #b5adc9;
      --bc-teal: #38bdf8;
      --bc-pill-bg: #4f3b7d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bc-midnight); color: var(--bc-text); min-height: 100vh; }

    /* Buffer Spinner Overlay */
    .spinner-overlay {
      position: fixed; inset: 0; background: rgba(22, 19, 41, 0.85); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; flex-direction: column;
      z-index: 9999;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid var(--bc-border);
      border-top-color: var(--bc-purple-primary); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    .spinner-text { font-size: 14px; color: var(--bc-text); font-weight: 500; letter-spacing: 0.3px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Login Screen */
    #login-view {
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .login-box {
      background: var(--bc-card); border: 1px solid var(--bc-border); border-radius: 20px;
      padding: 40px 32px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .login-logo {
      font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-box p { font-size: 14px; color: var(--bc-text-muted); margin-bottom: 24px; }
    .login-input {
      width: 100%; padding: 12px 16px; background: rgba(22, 19, 41, 0.7);
      border: 1px solid var(--bc-border); border-radius: 30px; color: #fff;
      font-size: 16px; text-align: center; margin-bottom: 18px; outline: none; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--bc-purple-primary); }
    .btn-login {
      width: 100%; padding: 12px; background: var(--bc-purple-primary); border: none;
      border-radius: 30px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover { background: var(--bc-purple-hover); }

    /* Navigation Bar */
    .top-nav {
      background: var(--bc-card); border-bottom: 1px solid var(--bc-border);
      padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand-title { font-size: 20px; font-weight: 800; letter-spacing: 0.8px; display: flex; align-items: center; gap: 10px; }
    .brand-title span { font-weight: 400; font-size: 13px; color: var(--bc-text-muted); margin-left: 8px; }

    /* Dashboard Layout */
    #dashboard-view { display: none; padding: 32px; max-width: 1400px; margin: 0 auto; }
    .toolbar-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
    }
    .search-input {
      padding: 10px 20px; background: var(--bc-card); border: 1px solid var(--bc-border);
      border-radius: 30px; color: #fff; font-size: 14px; min-width: 300px; outline: none;
    }
    .search-input:focus { border-color: var(--bc-purple-primary); }
    .btn-pill {
      padding: 10px 22px; background: var(--bc-pill-bg); border: 1px solid var(--bc-border);
      border-radius: 30px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s;
    }
    .btn-pill:hover { background: var(--bc-purple-primary); }

    /* Table */
    .table-container {
      background: var(--bc-card); border: 1px solid var(--bc-border); border-radius: 16px;
      overflow-x: auto; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th {
      background: rgba(0, 0, 0, 0.2); padding: 16px 20px; color: var(--bc-text-muted);
      font-weight: 600; border-bottom: 1px solid var(--bc-border); text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;
    }
    td { padding: 16px 20px; border-bottom: 1px solid var(--bc-border); color: var(--bc-text); }
    tbody tr { cursor: pointer; transition: background 0.15s; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
    .badge-status {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; background: rgba(56, 189, 248, 0.15); color: var(--bc-teal);
    }

    /* Drawer */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: none; z-index: 1000;
    }
    .drawer-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 540px;
      background: var(--bc-card); border-left: 1px solid var(--bc-border);
      display: flex; flex-direction: column; z-index: 1001;
      transform: translateX(100%); transition: transform 0.25s ease-in-out;
    }
    .drawer-open { transform: translateX(0); }
    .drawer-header {
      padding: 24px; border-bottom: 1px solid var(--bc-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-header h3 { font-size: 19px; font-weight: 700; }
    .drawer-header p { font-size: 13px; color: var(--bc-text-muted); margin-top: 4px; }
    .btn-close { background: none; border: none; color: var(--bc-text-muted); font-size: 18px; cursor: pointer; }
    .btn-close:hover { color: #fff; }

    .drawer-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .milestone-card {
      background: var(--bc-card-inner); border: 1px solid var(--bc-border);
      border-radius: 12px; padding: 20px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-top h4 { font-size: 15px; font-weight: 600; color: #fff; }
    .card-top span { font-size: 12px; color: var(--bc-teal); font-weight: 500; }

    .input-label { font-size: 12px; color: var(--bc-text-muted); display: block; margin-bottom: 6px; }
    .card-input, .card-textarea {
      width: 100%; background: var(--bc-midnight); border: 1px solid var(--bc-border);
      border-radius: 8px; color: #fff; padding: 10px 14px; font-size: 13px;
      margin-bottom: 14px; outline: none;
    }
    .card-textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
    .card-actions { display: flex; gap: 10px; }
    .btn-dispatch {
      flex: 1; padding: 10px 16px; background: var(--bc-purple-primary);
      border: none; border-radius: 20px; color: white;
      font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s;
    }
    .btn-dispatch:hover { background: var(--bc-purple-hover); }
  </style>
</head>
<body>

  <!-- Spinner Overlay -->
  <div id="spinner-overlay" class="spinner-overlay">
    <div class="spinner"></div>
    <div id="spinnerText" class="spinner-text">Processing request...</div>
  </div>

  <!-- Login Section -->
  <section id="login-view">
    <div class="login-box">
      <div class="login-logo">
        <i class="fa-solid fa-wave-square" style="color: var(--bc-purple-primary);"></i>
        <span>band<strong style="font-weight: 300;">CONNECT</strong></span>
      </div>
      <p>Provider Outreach & Roster Portal</p>
      <input type="password" id="pinInput" class="login-input" placeholder="Enter Authorization PIN" autofocus />
      <button class="btn-login" onclick="submitLogin()">Access Portal</button>
    </div>
  </section>

  <!-- Navigation -->
  <header id="mainNav" class="top-nav" style="display: none;">
    <div class="brand-title">
      <i class="fa-solid fa-wave-square" style="color: var(--bc-purple-primary);"></i>
      <span>band<strong style="font-weight: 300;">CONNECT</strong></span>
      <span>| Roster Engine</span>
    </div>
    <button class="btn-pill" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>
  </header>

  <!-- Main Dashboard -->
  <main id="dashboard-view">
    <div class="toolbar-bar">
      <div>
        <h2 style="font-size: 22px; font-weight: 700;">Patient Management</h2>
        <span style="font-size: 13px; color: var(--bc-text-muted);">Synced directly with Patient Master</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="🔍 Search patient, clinician, or clinic..." 
          oninput="filterPatients()" 
        />
        <button class="btn-pill" onclick="fetchPatients()">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Patient Name</th>
            <th>Clinician</th>
            <th>Clinic</th>
            <th>Device</th>
            <th>Condition</th>
            <th>Start Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="patientTableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- Timeline Drawer -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  <aside id="timelineDrawer" class="drawer-panel">
    <div class="drawer-header">
      <div>
        <h3 id="drawerPatientName">Patient Name</h3>
        <p id="drawerMeta">Device | Email</p>
      </div>
      <button class="btn-close" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="drawerCards"></div>
  </aside>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzZhcXbEJAOBNSnXqHur3a-lw2UAH_Oi__vj9QPVuxanZP0G3v5UBCmhml8_CVYuwEe/exec";

    let patientStore = [];
    let activePatient = null;

    function showSpinner(msg = "Processing request...") {
      document.getElementById('spinnerText').innerText = msg;
      document.getElementById('spinner-overlay').style.display = 'flex';
    }

    function hideSpinner() {
      document.getElementById('spinner-overlay').style.display = 'none';
    }

    async function submitLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (!pin) return alert("Please enter a PIN.");

      showSpinner("Authenticating credentials...");
      try {
        const res = await fetch(`${API_URL}?action=VERIFY_PIN&pin=${encodeURIComponent(pin)}`);
        const json = await res.json();
        if (json.success) {
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('mainNav').style.display = 'flex';
          document.getElementById('dashboard-view').style.display = 'block';
          fetchPatients();
        } else {
          alert(json.message || "Invalid PIN");
        }
      } catch (err) {
        alert("Authentication failed: " + err.message);
      } finally {
        hideSpinner();
      }
    }

    function logout() {
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('mainNav').style.display = 'none';
      document.getElementById('login-view').style.display = 'flex';
      document.getElementById('pinInput').value = '';
    }

    async function fetchPatients() {
      showSpinner("Loading patient roster...");
      try {
        const res = await fetch(`${API_URL}?action=GET_PATIENTS`);
        const json = await res.json();
        if (json.success) {
          patientStore = json.data;
          renderPatients(patientStore);
        } else {
          alert("Failed to load roster: " + json.message);
        }
      } catch (err) {
        alert("Error fetching roster: " + err.message);
      } finally {
        hideSpinner();
      }
    }

    function renderPatients(patients) {
      const tbody = document.getElementById('patientTableBody');
      tbody.innerHTML = '';

      if (!patients || patients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 24px; color: var(--bc-text-muted);">No patients found.</td></tr>';
        return;
      }

      patients.forEach(p => {
        const tr = document.createElement('tr');
        tr.onclick = () => openPatientDrawer(p);
        tr.innerHTML = `
          <td style="font-weight:600;">${escapeHtml(p.patientName)}</td>
          <td>${escapeHtml(p.clinician)}</td>
          <td>${escapeHtml(p.clinic)}</td>
          <td>${escapeHtml(p.deviceType)}</td>
          <td>${escapeHtml(p.condition)}</td>
          <td>${escapeHtml(p.startDate)}</td>
          <td><span class="badge-status">${escapeHtml(p.status)}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterPatients() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = patientStore.filter(p => 
        p.patientName.toLowerCase().includes(q) ||
        p.clinician.toLowerCase().includes(q) ||
        p.clinic.toLowerCase().includes(q)
      );
      renderPatients(filtered);
    }

    async function openPatientDrawer(patient) {
      activePatient = patient;
      document.getElementById('drawerPatientName').innerText = patient.patientName;
      document.getElementById('drawerMeta').innerText = `${patient.deviceType || 'Hardware'} • ${patient.email || 'No email on file'}`;
      
      const cardsBox = document.getElementById('drawerCards');
      cardsBox.innerHTML = '<div style="text-align:center; padding: 24px; color: var(--bc-text-muted);">Calculating therapy schedule...</div>';

      document.getElementById('drawerOverlay').style.display = 'block';
      document.getElementById('timelineDrawer').classList.add('drawer-open');

      try {
        const res = await fetch(`${API_URL}?action=GET_PATIENT_TIMELINE&rowNumber=${patient.rowNumber}`);
        const json = await res.json();
        if (json.success) {
          renderTimelineCards(json.timeline);
        } else {
          cardsBox.innerHTML = `<div style="color:#ef4444; padding:16px;">Failed to load timeline: ${json.message}</div>`;
        }
      } catch (err) {
        cardsBox.innerHTML = `<div style="color:#ef4444; padding:16px;">Network error: ${err.message}</div>`;
      }
    }

    function renderTimelineCards(timeline) {
      const container = document.getElementById('drawerCards');
      container.innerHTML = '';

      timeline.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'milestone-card';
        card.innerHTML = `
          <div class="card-top">
            <h4>${escapeHtml(item.title)}</h4>
            <span>Target: ${escapeHtml(item.scheduledDate)}</span>
          </div>
          <label class="input-label">Subject Line</label>
          <input type="text" id="subj_${idx}" class="card-input" value="${escapeHtml(item.subject)}" />
          <label class="input-label">Email Message</label>
          <textarea id="body_${idx}" class="card-textarea">${escapeHtml(item.defaultBody)}</textarea>
          <div class="card-actions">
            <button class="btn-dispatch" onclick="dispatchManual(${idx}, '${item.id}')">
              🚀 Send Now (Manual)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function dispatchManual(idx, milestoneId) {
      if (!activePatient || !activePatient.email) {
        return alert("Patient is missing an email address.");
      }

      const subject = document.getElementById(`subj_${idx}`).value.trim();
      const body = document.getElementById(`body_${idx}`).value.trim();

      if (!subject || !body) {
        return alert("Subject and body cannot be empty.");
      }

      showSpinner(`Dispatching ${milestoneId} email...`);
      try {
        const payload = {
          action: 'DISPATCH_CUSTOM_EMAIL',
          recipientEmail: activePatient.email,
          patientName: activePatient.patientName,
          subject: subject,
          htmlBody: body
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        
        if (json.success) {
          alert(`✅ Success: ${json.message}`);
        } else {
          alert(`❌ Dispatch error: ${json.message}`);
        }
      } catch (err) {
        alert(`Request failed: ${err.message}`);
      } finally {
        hideSpinner();
      }
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').style.display = 'none';
      document.getElementById('timelineDrawer').classList.remove('drawer-open');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
