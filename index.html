<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Connect Patient Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --card-bg: #182234;
      --border-dark: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-blue: #2563eb;
      --accent-purple: #7c3aed;
      --accent-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

    /* Buffer Spinner Overlay */
    .spinner-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; flex-direction: column;
      z-index: 9999;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid var(--border-dark);
      border-top-color: var(--primary-blue); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    .spinner-text { font-size: 15px; color: var(--text-main); font-weight: 500; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Login Screen */
    #login-view {
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .login-card {
      background: var(--panel-dark); border: 1px solid var(--border-dark); border-radius: 12px;
      padding: 32px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .login-card h2 { font-size: 22px; margin-bottom: 8px; }
    .login-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
    .login-input {
      width: 100%; padding: 12px 16px; background: var(--bg-dark); border: 1px solid var(--border-dark);
      border-radius: 6px; color: var(--text-main); font-size: 16px; text-align: center;
      margin-bottom: 16px; outline: none; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--primary-blue); }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary-blue); color: white;
      border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; }

    /* Dashboard Layout */
    #dashboard-view { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
    }
    .title-area h1 { font-size: 24px; font-weight: 700; }
    .title-area span { color: var(--text-muted); font-size: 14px; }

    .action-controls { display: flex; align-items: center; gap: 12px; }
    .search-input {
      padding: 10px 16px; background: var(--panel-dark); border: 1px solid var(--border-dark);
      border-radius: 6px; color: var(--text-main); font-size: 14px; min-width: 260px; outline: none;
    }
    .search-input:focus { border-color: var(--primary-blue); }
    .btn-secondary {
      padding: 10px 16px; background: var(--panel-dark); border: 1px solid var(--border-dark);
      border-radius: 6px; color: var(--text-main); font-size: 14px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s;
    }
    .btn-secondary:hover { background: var(--border-dark); }

    /* Table */
    .table-container {
      background: var(--panel-dark); border: 1px solid var(--border-dark); border-radius: 8px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th {
      background: rgba(0,0,0,0.2); padding: 14px 16px; color: var(--text-muted);
      font-weight: 600; border-bottom: 1px solid var(--border-dark);
    }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border-dark); color: var(--text-main); }
    tbody tr { cursor: pointer; transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    .badge-status {
      display: inline-block; padding: 4px 8px; border-radius: 4px;
      font-size: 12px; font-weight: 600; background: rgba(16, 185, 129, 0.15); color: var(--accent-green);
    }

    /* Drawer */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
      display: none; z-index: 1000;
    }
    .drawer-container {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 520px;
      background: var(--panel-dark); border-left: 1px solid var(--border-dark);
      display: flex; flex-direction: column; z-index: 1001; transform: translateX(100%);
      transition: transform 0.25s ease-in-out;
    }
    .drawer-open { transform: translateX(0); }
    .drawer-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border-dark);
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-header h3 { font-size: 18px; }
    .drawer-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
    .close-btn:hover { color: var(--text-main); }

    .drawer-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
    .milestone-card {
      background: var(--card-bg); border: 1px solid var(--border-dark);
      border-radius: 8px; padding: 18px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-top h4 { font-size: 15px; font-weight: 600; }
    .card-top span { font-size: 12px; color: var(--text-muted); }

    .input-label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
    .card-input, .card-textarea {
      width: 100%; background: var(--bg-dark); border: 1px solid var(--border-dark);
      border-radius: 6px; color: var(--text-main); padding: 8px 12px; font-size: 13px;
      margin-bottom: 12px; outline: none;
    }
    .card-textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .card-actions { display: flex; gap: 10px; }
    .btn-manual {
      flex: 1; padding: 8px 12px; background: rgba(37, 99, 235, 0.2);
      border: 1px solid var(--primary-blue); border-radius: 6px; color: #93c5fd;
      font-weight: 500; font-size: 13px; cursor: pointer; transition: background 0.2s;
    }
    .btn-manual:hover { background: var(--primary-blue); color: white; }
  </style>
</head>
<body>

  <!-- Buffer / Spinner Overlay -->
  <div id="spinner-overlay" class="spinner-overlay">
    <div class="spinner"></div>
    <div id="spinnerText" class="spinner-text">Processing request...</div>
  </div>

  <!-- Login Section -->
  <section id="login-view">
    <div class="login-card">
      <h2>Band Connect Portal</h2>
      <p>Enter your authorization PIN to access the roster.</p>
      <input type="password" id="pinInput" class="login-input" placeholder="••••••••••••" autofocus />
      <button class="btn-submit" onclick="submitLogin()">Log In</button>
    </div>
  </section>

  <!-- Main Dashboard -->
  <main id="dashboard-view">
    <div class="header-bar">
      <div class="title-area">
        <h1>Patient Outreach Roster</h1>
        <span>Live sync with Patient Master database</span>
      </div>
      <div class="action-controls">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search patient, clinician, or clinic..." oninput="filterPatients()" />
        <button class="btn-secondary" onclick="fetchPatients()">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Patient Name</th>
            <th>Clinician</th>
            <th>Clinic</th>
            <th>Device</th>
            <th>Condition</th>
            <th>Start Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="patientTableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- Outreach Drawer -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  <aside id="timelineDrawer" class="drawer-container">
    <div class="drawer-header">
      <div>
        <h3 id="drawerPatientName">Patient Name</h3>
        <p id="drawerMeta">Device | Email</p>
      </div>
      <button class="close-btn" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="drawerCards"></div>
  </aside>

  <script>
    // Replace with your Google Apps Script Web App exec URL
    const API_URL = "https://script.google.com/macros/s/AKfycbz_REPLACE_WITH_YOUR_EXEC_ID/exec";

    let patientStore = [];
    let activePatient = null;

    function showSpinner(msg = "Processing request...") {
      document.getElementById('spinnerText').innerText = msg;
      document.getElementById('spinner-overlay').style.display = 'flex';
    }

    function hideSpinner() {
      document.getElementById('spinner-overlay').style.display = 'none';
    }

    async function submitLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (!pin) return alert("Please enter a PIN.");

      showSpinner("Authenticating credentials...");
      try {
        const res = await fetch(`${API_URL}?action=VERIFY_PIN&pin=${encodeURIComponent(pin)}`);
        const json = await res.json();
        if (json.success) {
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('dashboard-view').style.display = 'block';
          fetchPatients();
        } else {
          alert(json.message || "Invalid PIN");
        }
      } catch (err) {
        alert("Authentication failed: " + err.message);
      } finally {
        hideSpinner();
      }
    }

    async function fetchPatients() {
      showSpinner("Loading patient database...");
      try {
        const res = await fetch(`${API_URL}?action=GET_PATIENTS`);
        const json = await res.json();
        if (json.success) {
          patientStore = json.data;
          renderPatients(patientStore);
        } else {
          alert("Failed to load roster: " + json.message);
        }
      } catch (err) {
        alert("Error fetching patients: " + err.message);
      } finally {
        hideSpinner();
      }
    }

    function renderPatients(patients) {
      const tbody = document.getElementById('patientTableBody');
      tbody.innerHTML = '';

      if (patients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 24px; color: var(--text-muted);">No patients match your search.</td></tr>';
        return;
      }

      patients.forEach(p => {
        const tr = document.createElement('tr');
        tr.onclick = () => openPatientDrawer(p);
        tr.innerHTML = `
          <td style="font-weight:600;">${escapeHtml(p.patientName)}</td>
          <td>${escapeHtml(p.clinician)}</td>
          <td>${escapeHtml(p.clinic)}</td>
          <td>${escapeHtml(p.deviceType)}</td>
          <td>${escapeHtml(p.condition)}</td>
          <td>${escapeHtml(p.startDate)}</td>
          <td><span class="badge-status">${escapeHtml(p.status)}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterPatients() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = patientStore.filter(p => 
        p.patientName.toLowerCase().includes(q) ||
        p.clinician.toLowerCase().includes(q) ||
        p.clinic.toLowerCase().includes(q)
      );
      renderPatients(filtered);
    }

    async function openPatientDrawer(patient) {
      activePatient = patient;
      document.getElementById('drawerPatientName').innerText = patient.patientName;
      document.getElementById('drawerMeta').innerText = `${patient.deviceType || 'Hardware'} • ${patient.email || 'No email on file'}`;
      
      const cardsBox = document.getElementById('drawerCards');
      cardsBox.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Calculating therapy schedule...</div>';

      document.getElementById('drawerOverlay').style.display = 'block';
      document.getElementById('timelineDrawer').classList.add('drawer-open');

      try {
        const res = await fetch(`${API_URL}?action=GET_PATIENT_TIMELINE&rowNumber=${patient.rowNumber}`);
        const json = await res.json();
        if (json.success) {
          renderTimelineCards(json.timeline);
        } else {
          cardsBox.innerHTML = `<div style="color:#ef4444; padding:16px;">Failed to load timeline: ${json.message}</div>`;
        }
      } catch (err) {
        cardsBox.innerHTML = `<div style="color:#ef4444; padding:16px;">Network error: ${err.message}</div>`;
      }
    }

    function renderTimelineCards(timeline) {
      const container = document.getElementById('drawerCards');
      container.innerHTML = '';

      timeline.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'milestone-card';
        card.innerHTML = `
          <div class="card-top">
            <h4>${escapeHtml(item.title)}</h4>
            <span>Target: ${escapeHtml(item.scheduledDate)}</span>
          </div>
          <label class="input-label">Subject</label>
          <input type="text" id="subj_${idx}" class="card-input" value="${escapeHtml(item.subject)}" />
          <label class="input-label">Message Content</label>
          <textarea id="body_${idx}" class="card-textarea">${escapeHtml(item.defaultBody)}</textarea>
          <div class="card-actions">
            <button class="btn-manual" onclick="dispatchManual(${idx}, '${item.id}')">
              🚀 Send Now (Manual)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function dispatchManual(idx, milestoneId) {
      if (!activePatient || !activePatient.email) {
        return alert("Patient is missing an email address.");
      }

      const subject = document.getElementById(`subj_${idx}`).value.trim();
      const body = document.getElementById(`body_${idx}`).value.trim();

      if (!subject || !body) {
        return alert("Subject and body cannot be empty.");
      }

      showSpinner(`Dispatching ${milestoneId} outreach...`);
      try {
        const payload = {
          action: 'DISPATCH_CUSTOM_EMAIL',
          recipientEmail: activePatient.email,
          patientName: activePatient.patientName,
          subject: subject,
          htmlBody: body
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        
        if (json.success) {
          alert(`✅ Success: ${json.message}`);
        } else {
          alert(`❌ Dispatch error: ${json.message}`);
        }
      } catch (err) {
        alert(`Request failed: ${err.message}`);
      } finally {
        hideSpinner();
      }
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').style.display = 'none';
      document.getElementById('timelineDrawer').classList.remove('drawer-open');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
